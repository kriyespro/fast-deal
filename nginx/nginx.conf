upstream django {
    server web:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name propsurat.com www.propsurat.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://propsurat.com$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name propsurat.com www.propsurat.com;

    ssl_certificate     /etc/letsencrypt/live/propsurat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propsurat.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    if ($host = www.propsurat.com) {
        return 301 https://propsurat.com$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering    on;
    }
}
