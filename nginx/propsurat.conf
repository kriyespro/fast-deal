upstream propsurat {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name propsurat.com www.propsurat.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://propsurat.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name propsurat.com www.propsurat.com;

    ssl_certificate     /etc/letsencrypt/live/propsurat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propsurat.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    if ($host = www.propsurat.com) {
        return 301 https://propsurat.com$request_uri;
    }

    location /static/ {
        alias /root/fast-deal-static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /root/fast-deal-media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass         http://propsurat;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering    on;
    }
}
